# 0.9.12 : le moteur de musique Windows (acestep.cpp) avait été compilé par MinGW au lieu de Visual C++ : il demandait
# libgomp-1.dll, libgcc_s_seh-1.dll, libstdc++-6.dll et libwinpthread-1.dll, absentes chez l'utilisateur (code
# 3221225781). Recompile avec cl (Visual C++), bibliothèque C intégrée (MultiThreaded), sans OpenMP ; vérifie qu'aucune
# DLL non livrée n'est demandée ; met à jour moteurs-creatifs.json et la release « moteurs-ia ».
name: Corriger moteur musique

on:
  push:
    paths:
      - .github/workflows/corriger_ace.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ace:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: acestep.cpp (processeur, Visual C++)
        shell: cmd
        run: |
          mkdir dist
          git clone --recursive https://github.com/ServeurpersoCom/acestep.cpp src-ace
          cd src-ace
          git submodule update --init --recursive
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cmake -S . -B build-cpu -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DGGML_AVX2=ON -DBUILD_SHARED_LIBS=OFF -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded -DGGML_OPENMP=OFF || exit /b 1
          cmake --build build-cpu --target ace-lm ace-synth -j %NUMBER_OF_PROCESSORS% || exit /b 1
          mkdir ..\pack-ace
          for /r build-cpu %%f in (ace-lm.exe ace-synth.exe *.dll) do copy "%%f" ..\pack-ace\ >nul
          copy LICENSE ..\pack-ace\LICENSE.txt
          cd ..
          dir pack-ace
          python outils_dev\verifier_dll.py pack-ace || exit /b 1
          pack-ace\ace-synth.exe --help > aide.txt 2>&1
          type aide.txt
          powershell -Command "Compress-Archive pack-ace\* dist\philcut-ace-windows-x64.zip"
      - name: Vulkan SDK
        id: vksdk
        continue-on-error: true
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true
      - name: acestep.cpp (Vulkan, carte graphique)
        if: steps.vksdk.outcome == 'success'
        continue-on-error: true
        shell: cmd
        run: |
          cd src-ace
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cmake -S . -B build-vk -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DGGML_AVX2=ON -DGGML_VULKAN=ON -DBUILD_SHARED_LIBS=OFF -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded -DGGML_OPENMP=OFF -DCMAKE_PREFIX_PATH="%VULKAN_SDK%" -DSPIRV-Headers_DIR="%VULKAN_SDK%\share\cmake\SPIRV-Headers" || exit /b 1
          cmake --build build-vk --target ace-lm ace-synth -j %NUMBER_OF_PROCESSORS% || exit /b 1
          mkdir ..\pack-ace-vk
          for /r build-vk %%f in (ace-lm.exe ace-synth.exe *.dll) do copy "%%f" ..\pack-ace-vk\ >nul
          copy LICENSE ..\pack-ace-vk\LICENSE.txt
          cd ..
          if not exist pack-ace-vk\ace-synth.exe exit /b 1
          python outils_dev\verifier_dll.py pack-ace-vk || exit /b 1
          powershell -Command "Compress-Archive pack-ace-vk\* dist\philcut-ace-vulkan-windows-x64.zip"
      - name: Catalogue et publication
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download moteurs-ia -p moteurs-creatifs.json -D dist
          python outils_dev/moteurs_creatifs.py corriger_moteur dist musique philcut-ace
          python outils_dev/moteurs_creatifs.py corriger_moteur dist musique_gpu philcut-ace-vulkan
          ls -la dist
          fichiers=$(ls dist/philcut-ace*-windows-x64.zip)
          gh release upload moteurs-ia $fichiers dist/moteurs-creatifs.json --clobber
