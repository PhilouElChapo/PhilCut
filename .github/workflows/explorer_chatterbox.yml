# 0.9.57 : exploration du modèle de voix Chatterbox multilingue (ONNX) avant de l'intégrer.
name: Explorer chatterbox

on:
  push:
    branches: [essai-voix]
    paths:
      - .github/workflows/explorer_chatterbox.yml
      - outils_dev/explorer_chatterbox.py
  workflow_dispatch:

jobs:
  explorer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q numpy onnxruntime huggingface_hub
      - run: mkdir -p expl && python outils_dev/explorer_chatterbox.py expl 2>&1 | tee expl/journal.txt
        shell: bash
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: explorer-chatterbox
          path: |
            expl/*.md
            expl/*.json
            expl/*.txt
